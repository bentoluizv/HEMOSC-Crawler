name: Executar Crawler Hemosc

on:
  schedule:
    # Roda diariamente às 09:00 UTC (06:00 horário de Brasília)
    - cron: '0 23 * * *'
  workflow_dispatch: # Permite rodar o bot manualmente pelo painel do GitHub

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Instalar navegadores e dependências do Playwright
        run: |
          playwright install firefox --with-deps

      - name: Debug de conectividade
        run: |
          curl -v -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o /dev/null -w "http_code=%{http_code} time=%{time_total}s\n" https://www.hemosc.org.br/ || true

      - name: Rodar o Crawler
        run: python main.py

      - name: Salvar alterações no banco de dados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hemosc.db
          git commit -m "Automated update hemosc.db [skip ci]" || exit 0
          git push